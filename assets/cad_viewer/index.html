<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD Viewer</title>
<style>
  /* Breakaway 3937 — CAD viewer. Carbon ground, one red used with intent,
     Chakra Petch display / Roboto body, The Cut on panels + buttons. */
  @font-face {
    font-family: "Chakra Petch";
    src: url("../fonts/ChakraPetch-SemiBold.ttf");
    font-weight: 600;
  }
  @font-face {
    font-family: "Chakra Petch";
    src: url("../fonts/ChakraPetch-Bold.ttf");
    font-weight: 700;
  }
  @font-face {
    font-family: "Roboto";
    src: url("../fonts/Roboto-Regular.ttf");
    font-weight: 400;
  }
  @font-face {
    font-family: "Roboto";
    src: url("../fonts/Roboto-Medium.ttf");
    font-weight: 500;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #C82027;               /* Breakaway Red — focus by default */
    --carbon: #121013;
    --surface: rgba(29, 26, 28, 0.9);
    --line: rgba(243, 241, 240, 0.09);
    --ink: #F3F1F0;
    --muted: #A6A19E;
    /* The Cut — 14px chamfer on TR + BL */
    --cut: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    --cut-btn: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
  }

  /* Light theme — red on white is the brand default; Carbon carries body copy. */
  :root[data-theme="light"] {
    --carbon: #FAF9F8;
    --surface: rgba(255, 255, 255, 0.94);
    --line: rgba(24, 20, 22, 0.10);
    --ink: #181416;
    --muted: #6A6462;
  }

  body {
    background: var(--carbon);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: "Roboto", system-ui, sans-serif;
    color: var(--ink);
  }

  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── Subsystem name label (top-left) ── */
  #subsystem-label {
    position: absolute;
    top: 32px;
    left: 32px;
    opacity: 0;
    pointer-events: none;
  }
  #subsystem-label .sub-tag {
    font-family: "Chakra Petch", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #subsystem-label .sub-name {
    font-family: "Chakra Petch", sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  /* ── Facts panel (right side) — The Cut container ── */
  #facts-panel {
    position: absolute;
    top: 50%;
    right: 32px;
    width: 300px;
    opacity: 0;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    clip-path: var(--cut);
    padding: 24px 22px;
    pointer-events: none;
    backdrop-filter: blur(16px);
  }
  #facts-title {
    font-family: "Chakra Petch", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  #facts-list {
    list-style: none;
  }
  #facts-list li {
    font-size: 14px;
    color: var(--ink);
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 9px;
  }
  #facts-list li::before {
    content: '▸';
    color: var(--accent);
    flex-shrink: 0;
    font-size: 10px;
    margin-top: 3px;
  }
  #facts-list li:last-child { border-bottom: none; }

  /* ── Interactive-mode subsystem bar (bottom) ── */
  #sub-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
    overflow-x: auto;
  }
  #sub-bar.hidden {
    display: none;
  }
  .sub-btn {
    height: 40px;
    padding: 0 20px;
    border: 1px solid var(--line);
    clip-path: var(--cut-btn);
    background: rgba(243, 241, 240, 0.04);
    color: var(--muted);
    font-family: "Chakra Petch", sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    outline: none;
    transition: color 0.15s, background 0.15s;
  }
  .sub-btn:hover {
    color: #ffffff;
    background: rgba(243, 241, 240, 0.09);
  }
  .sub-btn.active {
    background: var(--btn-accent, var(--accent));
    color: #ffffff;
    font-weight: 700;
  }
  .sub-btn.reset-btn {
    color: var(--muted);
    margin-right: 4px;
  }
  .sub-btn.reset-btn:hover {
    color: #ffffff;
    background: rgba(243, 241, 240, 0.06);
  }
  .sub-bar-spacer { flex: 1; }

  /* ── Status overlay (no model / loading / error) ── */
  #status-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    pointer-events: none;
  }
  #status-overlay.hidden { display: none; }
  #status-icon { font-size: 52px; opacity: 0.3; color: var(--accent); }
  #status-title {
    font-family: "Chakra Petch", sans-serif;
    font-size: 20px; font-weight: 700; color: rgba(243,241,240,0.55);
  }
  #status-sub {
    font-size: 13px;
    color: rgba(243,241,240,0.3);
    text-align: center;
    max-width: 320px;
    line-height: 1.55;
  }

  /* ── Missing libs banner ── */
  #libs-error {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--carbon);
  }
  #libs-error.visible { display: flex; }
  #libs-error p {
    font-size: 14px;
    color: rgba(243,241,240,0.45);
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }
  #libs-error code {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    background: rgba(243,241,240,0.07);
    padding: 8px 16px;
    border-radius: 5px;
    color: #F3F1F0;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="subsystem-label">
  <div class="sub-tag">SUBSYSTEM</div>
  <div class="sub-name"></div>
</div>

<div id="facts-panel">
  <div id="facts-title">KEY FACTS</div>
  <ul id="facts-list"></ul>
</div>

<div id="sub-bar" class="hidden"></div>

<div id="status-overlay">
  <div id="status-icon">⬡</div>
  <div id="status-title">No Model Loaded</div>
  <div id="status-sub">Upload a .glb file using the Control Screen to get started.</div>
</div>

<div id="libs-error">
  <div id="status-icon" style="font-size:48px;opacity:0.25;">⚠</div>
  <p style="color:rgba(255,255,255,0.5);font-size:16px;font-weight:600;">3D libraries not found</p>
  <p>Run the setup script from the project root to download Three.js and GSAP:</p>
  <code>uv run scripts/setup_cad_assets.py</code>
  <p>Then reload the control screen.</p>
</div>

<script>
  // Check for lib files before loading — show error banner if missing
  (function() {
    function checkLibs(cb) {
      var req = new XMLHttpRequest();
      req.open('HEAD', './lib/three.min.js', true);
      req.onload = function() { cb(req.status === 200); };
      req.onerror = function() { cb(false); };
      req.send();
    }
    checkLibs(function(ok) {
      if (!ok) {
        document.getElementById('libs-error').classList.add('visible');
        document.getElementById('status-overlay').classList.add('hidden');
      }
    });
  })();
</script>

<script src="./lib/three.min.js"></script>
<script src="./lib/GLTFLoader.js"></script>
<script src="./lib/OrbitControls.js"></script>
<script src="./lib/gsap.min.js"></script>
<script src="./viewer.js"></script>
</body>
</html>
