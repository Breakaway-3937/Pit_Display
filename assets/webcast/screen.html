<!doctype html>
<!--
  One overhead screen, drawn by the browser.

  The server substitutes {{SCREEN_ID}}, {{SCREEN_LABEL}} and {{WS_PORT}} when
  it serves this file — the page never works out its own endpoint, because the
  socket is on a different port and a page that derives one from `location` is
  a page that breaks the day somebody moves the other.

  Everything visible is built by screen.js from the state that arrives on the
  socket. There is no polling and no image: the dwell rail animates locally
  against a deadline, so a still slide costs the pit machine nothing at all.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{SCREEN_LABEL}}</title>
<link rel="stylesheet" href="/static/screen.css">

<body class="screen" data-screen="{{SCREEN_ID}}" data-ws-port="{{WS_PORT}}">

<!-- The ground. The plate floats on it, inset 40 design px. -->
<div class="ground" id="ground">
  <div class="plate" id="plate">

    <header class="band">
      <div class="wordmark"><b id="teamName">BREAKAWAY</b> <span id="teamNumber">3937</span></div>
      <div class="mono" id="headerRight">SCREEN A / STANDARD</div>
    </header>
    <div class="rule" id="ruleTop"></div>

    <!-- Every face renders into here. One at a time, swapped by screen.js. -->
    <main class="stage" id="stage"></main>

    <div class="rule" id="ruleBottom"></div>
    <footer class="ledger">
      <span class="mono" id="ledgerLeft">01 / 07</span>
      <span class="rail" id="rail"><i id="railFill"></i></span>
      <span class="mono" id="ledgerRight">ROTATION A</span>
    </footer>

  </div>
</div>

<!--
  Connection state, over the top of whatever was last drawn. A panel across
  the pit must never be ambiguous about "the picture is old": it keeps showing
  the last good state, dimmed, and says why.
-->
<div class="offline" id="offline" hidden>
  <div class="offline-card">
    <div class="offline-title" id="offlineTitle">Reconnecting to the pit machine</div>
    <div class="offline-body" id="offlineBody"></div>
  </div>
</div>

<script src="/static/screen.js"></script>
