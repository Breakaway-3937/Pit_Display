name: Build app

# **This is how the Windows build happens, and how the pit machines get it.**
#
# PyInstaller does not cross-compile: a Windows executable has to be produced
# on Windows, and every pit machine is Windows while nothing this is developed
# on is. Push a tag and this builds it, proves the packaged app actually boots
# on the runner, and publishes a Release. See DEPLOYMENT.md.
#
#   git tag v1.4.2 && git push --tags          → the stable channel
#   git tag v1.4.2-beta.1 && git push --tags   → the beta channel (prerelease)
#
# Running it by hand builds and self-checks without releasing anything, which
# is how you find out a change broke packaging without spending a version
# number on it.
#
# **Windows only, on purpose.** The Mac this is developed on runs from a
# checkout and never installs a build, so a macOS job would only ever burn
# quota — and macOS runners bill at *ten times* the rate of Linux against a
# private repo's monthly minutes, against Windows' two. Building both put one
# release at ~180 billed minutes out of 2,000; this is ~30.
#
# **Two assets, for two different readers.** `…-Setup.exe` is the one file a
# person downloads and double-clicks. `…-windows.zip` is what the *app* fetches
# when it updates itself. Both come out of one build, so what a person installs
# and what a machine updates to are the same bytes.
#
# The CAD model is not in git (~340 MB), so CI builds `--no-model`. The crew
# uploads one from Control → Project → CAD Viewer Config; it lives in the data
# directory, so it survives every update from then on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_self_check:
        description: "Run --self-check on the built app"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Windows Python opens a redirected stdout as **cp1252**, so the first
      # em-dash or arrow in any progress message raises UnicodeEncodeError and
      # kills the build. The scripts each force UTF-8 themselves (app/console.py);
      # this covers everything they shell out to as well — PyInstaller, uv, pip.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group build

      # Inno Setup compiles the installer. Present on some runner images and
      # not others, so it is checked for rather than assumed.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # The version an installed app reports is the tag that produced it, and
      # it is written in here rather than maintained by hand — a file somebody
      # has to remember to bump is a file that eventually lies about which
      # build is on the pit laptop. A manual run keeps 0.0.0+dev, which
      # `version.is_release()` refuses, so a dispatch build can never be
      # mistaken for a release or try to update itself.
      - name: Stamp the version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            uv run tools/stamp_version.py "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}"
          else
            echo "not a tag — leaving the dev version stamp in place"
          fi

      # The seed database is created by the app on first run and is not in git.
      # `--self-check` builds it, which also proves the migrations apply to an
      # empty file — the state every fresh install starts from.
      - name: Create the seed database
        run: uv run main.py --self-check
        env:
          QT_QPA_PLATFORM: offscreen
          PIT_LEDS_FAKE: "1"

      # Windows ships no libVLC, so without this the music player and the whole
      # equaliser are dead on every fresh pit machine until somebody installs
      # VLC by hand — an extra step that fails silently, because the app boots
      # perfectly without it and only goes quiet when an operator presses play.
      # The download is checked against VideoLAN's published SHA-256.
      - name: Fetch the VLC runtime
        run: uv run tools/fetch_vlc.py

      - name: Build
        run: uv run tools/build_app.py --no-model --zip --installer

      # Runs the *packaged* app, not the source. This is what catches the
      # failures that only exist in a bundle — a missing QtWebEngineProcess, an
      # unwritable data directory, an asset that never got collected. No
      # release is published if this fails.
      - name: Self-check the packaged app
        if: inputs.run_self_check != false
        shell: pwsh
        run: |
          & "dist\Breakaway Pit Display\Breakaway Pit Display.exe" --self-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The zip is named with the version because `manifest.json` points the
      # updater at it by name; the installer already names itself.
      - name: Name the update payload
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="0.0.0-dev"
          mv "dist/Breakaway Pit Display.zip" \
             "dist/Breakaway-Pit-Display-${VERSION}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pit-display-windows
          path: |
            dist/Breakaway-Pit-Display-*-windows.zip
            dist/Breakaway-Pit-Display-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # both are already compressed

  # ── Publish ────────────────────────────────────────────────────────────────
  # Tags only. A manual run stops above with artifacts and no release, so
  # nothing an installed app can see changes until a version number is spent.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creating a release is a write to the repo
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The manifest names the update payload and its SHA-256. The updater
      # refuses a release without one — the hash is the only check between a
      # download and the pit machine's install folder.
      - name: Build the manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP=$(ls assets/Breakaway-Pit-Display-*-windows.zip | head -1)
          python3 tools/make_manifest.py \
            --version "$VERSION" --tag "${GITHUB_REF_NAME}" \
            --asset "windows=${ZIP}" \
            --out assets/manifest.json

      # Two assets on one page needs a sentence saying which is which, or
      # somebody downloads the 750 MB update payload and wonders why there is
      # no installer in it. The generated changelog stays on top; this goes
      # underneath it.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > notes.md || true
          cat >> notes.md <<'EOF'

          ---

          ### Which file do I want?

          **`Breakaway-Pit-Display-…-Setup.exe`** — this one. Download it on the
          pit machine, double-click, done. It installs, makes the Start Menu
          entry, and sets the machine up to take future updates by itself. No
          administrator needed. Your database, checklists, CAN-id names and
          uploaded CAD model are never touched by an install.

          **`Breakaway-Pit-Display-…-windows.zip`** — not for people. It is what
          an already-installed app downloads when it updates itself.

          `manifest.json` is the checksum the app verifies that download against.
          EOF

      # A tag with a prerelease part (v1.4.2-beta.1) is published as a
      # prerelease, which is what puts it on the beta channel and keeps it away
      # from every machine following stable.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md $PRERELEASE \
            assets/manifest.json \
            assets/Breakaway-Pit-Display-*-Setup.exe \
            assets/Breakaway-Pit-Display-*-windows.zip
