[project]
name = "pit-display"
version = "0.1.0"
description = "FRC pit display system — 4-screen desktop app with local SQLite database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyqt6>=6.7.0",
    "PyQt6-Qt6>=6.7.0",
    "pyqt6-webengine>=6.10.0",
    "pyserial>=3.5",
    "python-vlc>=3.0.21",
    "mutagen>=1.47.0",
]

[project.scripts]
pit-display = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
